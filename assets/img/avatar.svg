<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F2A5A"/>
      <stop offset="100%" stop-color="#0E7C86"/>
    </linearGradient>
    <filter id="avShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- دائرة الخلفية -->
  <circle cx="60" cy="60" r="56" fill="url(#avatarGrad)" filter="url(#avShadow)"/>
  <!-- إطار ذهبي خارجي -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#F2A900" stroke-width="3" opacity="0.85"/>
  <!-- رأس المستخدم -->
  <circle cx="60" cy="48" r="19" fill="#ffffff"/>
  <!-- جسم/أكتاف المستخدم -->
  <path d="M 28 98 C 28 76, 42 68, 60 68 C 78 68, 92 76, 92 98 Z" fill="#ffffff" opacity="0.95"/>
  <!-- قبعة تخرج صغيرة أنيقة باللون الذهبي -->
  <polygon points="60,20 80,28 60,36 40,28" fill="#F2A900"/>
  <path d="M 75 30 L 76 40 L 73 40 Z" fill="#F2A900"/>
</svg>